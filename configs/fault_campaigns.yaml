# Phase 5 - fault injection campaigns. One primary IV per campaign
# (full factorial would be 5 x 4 x 4 x 2 x 5 cells - not affordable live).
#
# Timeline of every run (seconds from start):
#   0-60     warm-up + steady state   (pre-fault band measured in 30-60)
#   60-120   fault window             (FAULT_WINDOW_SEC = 60)
#   120-180  production continues, recovery is measured from 120
#   then     drain until the queue is empty or drain_timeout_s passes
#
# fault_rate is the probability per record at the injection point.
seed: 4242
defaults:
  repeats: 5
  randomise_order: true
  fixed:
    arm: queue
    load_profile: normal
    order_count: 3600          # 20 msg/s for 180 s
    rate_per_sec: 20
    fault_start_s: 60
    fault_window_s: 60
    fault_rate: 0.25
    drain_timeout_s: 900       # observation horizon
    visibility_timeout: 60
    max_receive_count: 5
    batch_size: 10

campaigns:
  # H1: visibility timeout vs loss under consumer failure
  A_vt_consumer_kill:
    fixed: {fault_mode: consumer_kill}
    matrix:
      visibility_timeout: [30, 60, 120, 300, 600]

  # H2: retry limit vs recovery time
  B_mrc_unhandled_error:
    fixed: {fault_mode: unhandled_error, visibility_timeout: 30}
    matrix:
      max_receive_count: [1, 3, 5, 10]

  # DLQ / redrive threshold vs dead-letter capture
  C_mrc_datastore_reject:
    fixed: {fault_mode: datastore_reject, visibility_timeout: 30, fault_rate: 0.5}
    matrix:
      max_receive_count: [1, 3, 5, 10]

  # downstream hang: visibility timeout vs recovery
  D_vt_datastore_timeout:
    fixed: {fault_mode: datastore_timeout}
    matrix:
      visibility_timeout: [30, 60, 120, 300, 600]

  # H3: does the steady-state optimum (VT 600, batch 50) hold up under fault?
  E_guidance_transfer:
    fixed: {fault_mode: consumer_kill}
    matrix:
      visibility_timeout: [30, 600]
      batch_size: [10, 50]

  # control (sync) vs treatment (queue) arm under every failure type
  F_arms_under_fault:
    fixed: {visibility_timeout: 30}
    matrix:
      arm: [sync, queue]
      fault_mode: [none, consumer_kill, unhandled_error, datastore_reject, datastore_timeout]

  # exploratory VT x maxReceiveCount grid, only for the DLQ heatmap
  H_vt_mrc_grid:
    repeats: 3
    fixed: {fault_mode: unhandled_error}
    matrix:
      visibility_timeout: [30, 120, 600]
      max_receive_count: [1, 3, 10]
